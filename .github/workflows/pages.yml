name: Publish GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "opencv-ts/**"
      - "generate-api-docs/**"
      - "pages/**"
      - "test-projects/react1/**"
      - "test-projects/code-editor/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install generate-api-docs dependencies
        working-directory: generate-api-docs
        run: npm install

      - name: Generate opencv-ts API docs
        working-directory: generate-api-docs
        run: npm run generate

      - name: Build react1 demo
        working-directory: test-projects/react1
        run: |
          npm install
          npm run build


      # - name: Build code-editor preconditions
      #   working-directory: test-projects/project-to-vfs
      #   run: |
      #     npm install
      #     sh scripts/generate.sh

      - name: Build code-editor demo
        working-directory: test-projects/code-editor
        run: |
          npm install
          npm run build



      - name: Copy demo builds into pages
        run: |
          mkdir -p pages/react1 pages/code-editor
          cp -r test-projects/react1/dist/. pages/react1/
          cp -r test-projects/code-editor/dist/. pages/code-editor/

      - name: Ensure .nojekyll
        run: touch pages/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
