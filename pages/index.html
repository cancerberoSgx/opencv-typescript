<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>opencv-typescript</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1b1f23;
    --muted: #57606a;
    --border: #d0d7de;
    --accent: #0969da;
    --card-bg: #f6f8fa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #8b949e;
      --border: #30363d;
      --accent: #58a6ff;
      --card-bg: #161b22;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding-block: 3rem;
    padding-inline: 1rem;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
  }
  main { width: 100%; max-width: 40rem; }
  h1 { font-size: 1.75rem; margin: 0 0 0.25rem; }
  p.lede { color: var(--muted); margin: 0 0 2rem; }
  a { color: var(--accent); }
  .card {
    display: block;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card-bg);
    padding: 1.25rem 1.5rem;
    text-decoration: none;
    color: inherit;
    margin-bottom: 1rem;
  }
  .card:hover { border-color: var(--accent); }
  .card h2 { margin: 0 0 0.35rem; font-size: 1.1rem; color: var(--accent); }
  .card p { margin: 0; color: var(--muted); font-size: 0.95rem; }
  footer { margin-top: 2rem; color: var(--muted); font-size: 0.85rem; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>opencv-typescript</h1>
  <p class="lede">Community TypeScript type declarations for opencv.js.</p>

  <a class="card" href="./opencv-ts-docs/index.html">
    <h2>opencv-ts API Docs &rarr;</h2>
    <p>Generated HTML API reference for the <code>opencv-ts</code> package, built with TypeDoc from its JSDoc-annotated <code>.d.ts</code> files.</p>
  </a>

  <footer>
    Source: <a href="https://github.com/cancerberoSgx/opencv-typescript">github.com/cancerberoSgx/opencv-typescript</a>
  </footer>
</main>
</body>
</html>
